<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

</head>

<body>

    <h1>Login</h1>

    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endwith %}

    <form method="POST">

        <label>Username</label>
        <br>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Password</label>
        <br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <a href="{{ url_for('authentication.register') }}">
        Create Job Seeker Account
    </a>

</body>

</html>
